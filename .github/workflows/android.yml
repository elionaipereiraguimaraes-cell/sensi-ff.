
name: Build Sensi FF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Verificar arquivos
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -iname "index.html"

      - name: Verificar HTML
        run: |
          test -f index.html
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

